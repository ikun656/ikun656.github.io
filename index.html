<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ikun656 工具站</title>
    <style>
        /* 全局重置与基础 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f4f6f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 40px 36px;
            transition: all 0.2s;
        }

        /* 头部区域 */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand .tagline {
            font-size: 15px;
            color: #64748b;
            margin-top: 2px;
            -webkit-text-fill-color: #64748b; /* 覆盖渐变 */
            background: none;
        }

        .header .right {
            font-size: 14px;
            color: #94a3b8;
            background: #f1f5f9;
            padding: 6px 16px;
            border-radius: 30px;
        }

        /* 工具网格 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin-top: 12px;
        }

        .tool-card {
            background: #fafcff;
            border-radius: 20px;
            padding: 24px 22px 22px;
            border: 1px solid #eef2f8;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
            border-color: #cbd5e1;
        }

        .tool-card .icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .tool-card .name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #0f172a;
        }

        .tool-card .desc {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
            flex: 1;
            margin-bottom: 16px;
        }

        .tool-card .btn-go {
            align-self: flex-start;
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .tool-card .btn-go:hover {
            background: #1d4ed8;
        }

        .tool-card .btn-go::after {
            content: "→";
            transition: transform 0.2s;
        }

        .tool-card .btn-go:hover::after {
            transform: translateX(4px);
        }

        /* 空状态或占位提示 */
        .coming-soon {
            opacity: 0.6;
            pointer-events: none;
        }
        .coming-soon .btn-go {
            background: #94a3b8;
            cursor: default;
        }
        .coming-soon .btn-go::after {
            content: "🔜";
        }

        /* 底部 */
        .footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid #eef2f8;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #94a3b8;
        }

        .footer a {
            color: #2563eb;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .container {
                padding: 24px 16px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .brand h1 {
                font-size: 24px;
            }
            .tools-grid {
                grid-template-columns: 1fr;
            }
            .footer {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 头部 -->
        <header class="header">
            <div class="brand">
                <div class="logo">🛠</div>
                <div>
                    <h1>ikun656 工具站</h1>
                    <div class="tagline">实用 · 轻量 · 在线</div>
                </div>
            </div>
            <div class="right">✨ 持续更新中</div>
        </header>

        <!-- 工具列表 -->
        <div class="tools-grid">

            <!-- 卡片 1：VSIX 下载加速器 -->
            <div class="tool-card">
                <div class="icon">⬇️</div>
                <div class="name">VSIX 下载加速器</div>
                <div class="desc">
                    从 VS Marketplace 一键获取扩展安装包，支持版本选择、链接复制，解决下载缓慢问题。
                </div>
                <a href="/vsix-downloader" class="btn-go">前往使用</a>
                <!-- 如果你的 VSIX 页面就在根目录，改为 href="/" 或 href="./vsix.html" -->
                <!-- 如果是子目录，比如 /vsix/index.html，就写 href="/vsix/" -->
            </div>

            <!-- 卡片 2：占位（你可以修改或删除） -->
            <div class="tool-card coming-soon">
                <div class="icon">🧩</div>
                <div class="name">更多工具即将上线</div>
                <div class="desc">
                    正在筹备中，敬请期待更多实用小工具。
                </div>
                <span class="btn-go">开发中</span>
            </div>

            <!-- 卡片 3：占位（你可以修改或删除） -->
            <div class="tool-card coming-soon">
                <div class="icon">📦</div>
                <div class="name">JSON 格式化器</div>
                <div class="desc">
                    计划提供 JSON 美化、校验、压缩等常用功能。
                </div>
                <span class="btn-go">规划中</span>
            </div>

            <!-- 你可以继续添加更多卡片，复制上面的 .tool-card 结构即可 -->
        </div>

        <!-- 底部 -->
        <footer class="footer">
            <span>© 2026 ikun656 · 开源工具站</span>
            <span>
                托管于 <a href="https://github.com/ikun656" target="_blank">GitHub</a>
            </span>
        </footer>

    </div>

</body>
</html>
