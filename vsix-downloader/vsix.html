<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VSIX 下载器</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #0078d4;
            --primary-dark: #005a9e;
            --primary-light: #e6f2fc;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #1e1e1e;
            --text-secondary: #5c5c5c;
            --border: #d1d9e6;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s ease;
            --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px 28px 36px;
            transition: var(--transition);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .header .logo {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--primary), #106ebe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin-top: -4px;
            margin-bottom: 24px;
            padding-left: 4px;
            border-left: 3px solid var(--primary);
            padding-left: 12px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .input-group .input-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: var(--font);
            transition: var(--transition);
            background: #fafcfe;
            color: var(--text);
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.15);
            background: #fff;
        }
        .input-group input::placeholder {
            color: #a0aec0;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 500;
            font-family: var(--font);
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 120, 212, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-success {
            background: #28a745;
            color: #fff;
        }
        .btn-success:hover {
            background: #1e7e34;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }
        .btn-success:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary-light);
        }
        .btn-outline:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #e9ecf0;
            color: var(--text);
        }
        .btn-secondary:hover {
            background: #d5dce4;
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .examples span {
            cursor: pointer;
            color: var(--primary);
            background: var(--primary-light);
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 500;
            transition: var(--transition);
            font-size: 13px;
        }
        .examples span:hover {
            background: #c7e0f7;
            color: var(--primary-dark);
        }

        .status {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 18px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
            line-height: 1.5;
            border-left: 4px solid transparent;
        }
        .status.show {
            display: flex;
        }
        .status.info {
            background: #e7f3ff;
            border-left-color: var(--primary);
            color: #00457e;
        }
        .status.success {
            background: #e6f9ed;
            border-left-color: #28a745;
            color: #155724;
        }
        .status.error {
            background: #fde8e8;
            border-left-color: #dc3545;
            color: #721c24;
        }
        .status.loading {
            background: #f0f2f5;
            border-left-color: #6c757d;
            color: #3d3d3d;
        }
        .status .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid #d1d9e6;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            border: 1px solid var(--border);
        }
        .info-grid .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .info-grid .value {
            font-size: 15px;
            font-weight: 500;
            word-break: break-all;
            font-family: 'SF Mono', 'Consolas', monospace;
        }
        .info-grid .value .highlight {
            color: var(--primary);
        }
        .info-grid .item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .version-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 12px 0 4px;
            border-top: 1px solid var(--border);
        }
        .version-section label {
            font-weight: 500;
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .version-section select {
            flex: 1;
            min-width: 140px;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: var(--font);
            background: #fff;
            color: var(--text);
            transition: var(--transition);
            cursor: pointer;
            appearance: auto;
        }
        .version-section select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.12);
        }
        .version-section select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .version-section .manual-input {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 130px;
        }
        .version-section .manual-input input {
            flex: 1;
            min-width: 80px;
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: var(--font);
            transition: var(--transition);
            background: #fafcfe;
        }
        .version-section .manual-input input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.12);
        }
        .version-section .manual-input input::placeholder {
            color: #b0b8c4;
            font-size: 13px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 6px;
        }
        .actions .btn {
            flex: 1;
            min-width: 120px;
            padding: 14px 20px;
            font-size: 15px;
        }
        .actions .btn .icon {
            font-size: 18px;
        }

        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 16px;
            }
            .header h1 {
                font-size: 22px;
            }
            .info-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .version-section {
                flex-direction: column;
                align-items: stretch;
            }
            .version-section .manual-input {
                flex-wrap: wrap;
            }
            .actions .btn {
                min-width: 100px;
                padding: 12px 16px;
                font-size: 14px;
            }
            .input-group .btn {
                width: 100%;
            }
            .input-group .input-wrap {
                min-width: 100%;
            }
            .examples {
                font-size: 12px;
            }
            .examples span {
                font-size: 12px;
                padding: 2px 10px;
            }
        }

        @media (max-width: 400px) {
            .header .logo {
                width: 34px;
                height: 34px;
                font-size: 18px;
            }
            .header h1 {
                font-size: 19px;
            }
            .subtitle {
                font-size: 13px;
            }
            .btn {
                font-size: 13px;
                padding: 10px 16px;
            }
        }

        .hidden {
            display: none !important;
        }
        .mt-1 {
            margin-top: 8px;
        }
        .gap-1 {
            gap: 6px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flash-success {
            animation: flashGreen 0.6s ease;
        }
        @keyframes flashGreen {
            0%,
            100% {
                background: transparent;
            }
            50% {
                background: #d4edda;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="app">

        <div class="header">
            <div class="logo">⬇</div>
            <h1>VSIX 下载器</h1>
        </div>
        <div class="subtitle">
            从 Visual Studio Marketplace 一键获取扩展的 VSIX 安装包
        </div>

        <div class="input-group">
            <div class="input-wrap">
                <input
                type="text"
                id="inputExtension"
                placeholder="例如：ms-dotnettools.csharp 或 完整URL"
                autofocus
                spellcheck="false"
                />
            </div>
            <button class="btn btn-primary" id="btnFetch">🔍 获取版本</button>
        </div>

        <div class="examples">
            <span>试试：</span>
            <span data-example="ms-dotnettools.csharp">C#</span>
            <span data-example="ms-vscode.vscode-js-debug">JS Debug</span>
            <span data-example="ms-python.python">Python</span>
            <span data-example="GitHub.copilot">Copilot</span>
            <span data-example="ms-vscode.cpptools">C++</span>
        </div>

        <div class="status" id="status">
            <span id="statusIcon"></span>
            <span id="statusText">就绪</span>
        </div>

        <div class="info-grid" id="infoGrid">
            <div class="item">
                <span class="label">发布者 (Publisher)</span>
                <span class="value" id="displayPublisher">—</span>
            </div>
            <div class="item">
                <span class="label">扩展名 (Extension)</span>
                <span class="value" id="displayExtension">—</span>
            </div>
        </div>

        <div class="version-section">
            <label for="versionSelect">📦 版本</label>
            <select id="versionSelect" disabled>
                <option value="">— 请先获取版本 —</option>
            </select>
            <div class="manual-input">
                <input
                type="text"
                id="manualVersion"
                placeholder="或手动输入版本"
                spellcheck="false"
                />
                <button class="btn btn-secondary" id="btnUseManual" title="使用手动输入的版本">使用</button>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-success" id="btnDownload" disabled>
                <span class="icon">⬇</span> 下载 VSIX
            </button>
            <button class="btn btn-outline" id="btnCopyLink" disabled>
                <span class="icon">📋</span> 复制链接
            </button>
            <button class="btn btn-secondary" id="btnOpenMarket" disabled>
                <span class="icon">🌐</span> 市场页
            </button>
        </div>

        <div class="footer">
            <span>VSIX 下载器 · 开源工具</span>
            <span>
                数据来自
                <a href="https://marketplace.visualstudio.com/" target="_blank" rel="noopener">
                    Visual Studio Marketplace
                </a>
            </span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== DOM 引用 =====
            const inputEl = document.getElementById('inputExtension');
            const btnFetch = document.getElementById('btnFetch');
            const statusEl = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const statusIcon = document.getElementById('statusIcon');
            const displayPublisher = document.getElementById('displayPublisher');
            const displayExtension = document.getElementById('displayExtension');
            const versionSelect = document.getElementById('versionSelect');
            const manualVersion = document.getElementById('manualVersion');
            const btnUseManual = document.getElementById('btnUseManual');
            const btnDownload = document.getElementById('btnDownload');
            const btnCopyLink = document.getElementById('btnCopyLink');
            const btnOpenMarket = document.getElementById('btnOpenMarket');

            // ===== 状态 =====
            let currentPublisher = '';
            let currentExtension = '';
            let currentVersion = '';
            let allVersions = [];
            let isFetching = false;

            // ===== 工具函数 =====
            function setStatus(type, message, extra = '') {
                statusEl.className = 'status show ' + type;
                statusText.textContent = message;
                if (type === 'loading') {
                    statusIcon.innerHTML = '<span class="spinner"></span>';
                } else if (type === 'success') {
                    statusIcon.textContent = '✅';
                } else if (type === 'error') {
                    statusIcon.textContent = '❌';
                } else if (type === 'info') {
                    statusIcon.textContent = 'ℹ️';
                } else {
                    statusIcon.textContent = '';
                }
                if (extra) {
                    statusText.textContent += ' ' + extra;
                }
            }

            function hideStatus() {
                statusEl.className = 'status';
                statusText.textContent = '';
                statusIcon.textContent = '';
            }

            function setInfo(publisher, extension) {
                displayPublisher.textContent = publisher || '—';
                displayExtension.textContent = extension || '—';
                currentPublisher = publisher || '';
                currentExtension = extension || '';
            }

            function resetUI() {
                versionSelect.innerHTML = '<option value="">— 请先获取版本 —</option>';
                versionSelect.disabled = true;
                manualVersion.value = '';
                currentVersion = '';
                btnDownload.disabled = true;
                btnCopyLink.disabled = true;
                btnOpenMarket.disabled = true;
                allVersions = [];
            }

            function enableActions() {
                const hasVersion = currentVersion && currentPublisher && currentExtension;
                btnDownload.disabled = !hasVersion;
                btnCopyLink.disabled = !hasVersion;
                btnOpenMarket.disabled = !(currentPublisher && currentExtension);
            }

            function buildMarketUrl(publisher, extension) {
                return `https://marketplace.visualstudio.com/items?itemName=${publisher}.${extension}`;
            }

            function buildDownloadUrl(publisher, extension, version) {
                return `https://marketplace.visualstudio.com/_apis/public/gallery/publishers/${publisher}/vsextensions/${extension}/${version}/vspackage`;
            }

            // ===== 解析输入 =====
            function parseInput(raw) {
                let str = raw.trim();
                if (!str) return null;

                if (str.includes('itemName=')) {
                    try {
                        const url = new URL(str);
                        const param = url.searchParams.get('itemName');
                        if (param) {
                            str = param;
                        }
                    } catch (_) {}
                }

                str = str.replace(/\/+$/, '');
                const parts = str.split('.');
                if (parts.length >= 2) {
                    const publisher = parts[0];
                    const extension = parts.slice(1).join('.');
                    if (publisher && extension) {
                        return { publisher, extension };
                    }
                }

                if (str.includes('/')) {
                    const parts2 = str.split('/').filter(Boolean);
                    if (parts2.length >= 2) {
                        return { publisher: parts2[0], extension: parts2.slice(1).join('.') };
                    }
                }

                return null;
            }

            // ===== 增强版获取版本 =====
            async function fetchVersions(publisher, extension) {
                const apiUrl =
                    `https://marketplace.visualstudio.com/_apis/public/gallery/publishers/${publisher}/vsextensions/${extension}`;

                const proxyList = [
                    (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                    (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                    (url) => `https://cors-anywhere.herokuapp.com/${url}`,
                ];

                // 直接尝试
                try {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 8000);
                    const resp = await fetch(apiUrl, { signal: controller.signal });
                    clearTimeout(timeout);
                    if (resp.ok) {
                        return await resp.json();
                    }
                } catch (_) {}

                // 代理
                for (const proxyFn of proxyList) {
                    try {
                        const proxyUrl = proxyFn(apiUrl);
                        const controller = new AbortController();
                        const timeout = setTimeout(() => controller.abort(), 12000);
                        const resp = await fetch(proxyUrl, { signal: controller.signal });
                        clearTimeout(timeout);
                        if (resp.ok) {
                            return await resp.json();
                        }
                    } catch (_) {}
                }

                throw new Error('所有代理均无法获取版本列表，请手动输入版本号');
            }

            // ===== 提取版本 =====
            function extractVersions(data) {
                if (!data) return [];
                let versions = [];

                if (Array.isArray(data.versions)) {
                    versions = data.versions.map(v => v.version).filter(Boolean);
                }
                if (Array.isArray(data) && versions.length === 0) {
                    versions = data.map(v => v.version || v).filter(Boolean);
                }
                if (data.results && Array.isArray(data.results) && versions.length === 0) {
                    for (const result of data.results) {
                        if (result.versions && Array.isArray(result.versions)) {
                            versions = result.versions.map(v => v.version).filter(Boolean);
                            break;
                        }
                    }
                }

                const unique = [...new Set(versions)];
                return unique.sort((a, b) => {
                    const partsA = a.split('.').map(Number);
                    const partsB = b.split('.').map(Number);
                    for (let i = 0; i < Math.max(partsA.length, partsB.length); i++) {
                        const na = partsA[i] || 0;
                        const nb = partsB[i] || 0;
                        if (na !== nb) return nb - na;
                    }
                    return 0;
                });
            }

            // ===== 更新下拉 =====
            function populateVersionSelect(versions, selectedVersion = null) {
                versionSelect.innerHTML = '';
                if (!versions || versions.length === 0) {
                    versionSelect.innerHTML = '<option value="">— 无可用版本 —</option>';
                    versionSelect.disabled = true;
                    return;
                }

                allVersions = versions;
                let hasSelected = false;
                for (const v of versions) {
                    const opt = document.createElement('option');
                    opt.value = v;
                    opt.textContent = v;
                    if (selectedVersion && v === selectedVersion) {
                        opt.selected = true;
                        hasSelected = true;
                    }
                    versionSelect.appendChild(opt);
                }

                if (!hasSelected && versions.length > 0) {
                    versionSelect.value = versions[0];
                    currentVersion = versions[0];
                } else if (hasSelected) {
                    currentVersion = selectedVersion;
                } else {
                    currentVersion = '';
                }

                versionSelect.disabled = false;
                enableActions();
            }

            // ===== 主流程：获取版本 =====
            async function handleFetch() {
                if (isFetching) return;

                const raw = inputEl.value.trim();
                if (!raw) {
                    setStatus('error', '请输入扩展标识或市场 URL');
                    inputEl.focus();
                    return;
                }

                const parsed = parseInput(raw);
                if (!parsed) {
                    setStatus('error', '无法解析输入，请使用 "publisher.extension" 格式或完整市场 URL');
                    return;
                }

                const { publisher, extension } = parsed;
                setInfo(publisher, extension);
                resetUI();
                setStatus('loading', `正在获取 ${publisher}.${extension} 的版本列表...`);

                isFetching = true;
                btnFetch.disabled = true;
                btnFetch.textContent = '⏳ 获取中...';

                try {
                    const data = await fetchVersions(publisher, extension);
                    const versions = extractVersions(data);

                    if (versions.length === 0) {
                        setStatus('error', '未找到任何版本，请检查扩展名称是否正确，或手动输入版本');
                        versionSelect.innerHTML = '<option value="">— 无版本 —</option>';
                        versionSelect.disabled = true;
                        enableActions();
                        btnFetch.disabled = false;
                        btnFetch.textContent = '🔍 获取版本';
                        isFetching = false;
                        return;
                    }

                    const latest = versions[0];
                    populateVersionSelect(versions, latest);
                    setStatus('success', `✅ 获取成功！共 ${versions.length} 个版本，最新版本：${latest}`);
                    btnFetch.textContent = '🔄 刷新';
                    enableActions();

                } catch (err) {
                    console.warn('Fetch error:', err);
                    setStatus('error', `获取失败：${err.message || '未知错误'}。请手动输入版本号。`);
                    versionSelect.innerHTML = '<option value="">— 请手动输入 —</option>';
                    versionSelect.disabled = true;
                    if (manualVersion.value.trim()) {
                        currentVersion = manualVersion.value.trim();
                        enableActions();
                    } else {
                        enableActions();
                    }
                } finally {
                    isFetching = false;
                    btnFetch.disabled = false;
                    if (btnFetch.textContent === '⏳ 获取中...') {
                        btnFetch.textContent = '🔍 获取版本';
                    }
                }
            }

            // ===== 下载：优先Fetch，失败回退 =====
            async function handleDownload() {
                if (!currentPublisher || !currentExtension || !currentVersion) {
                    setStatus('error', '缺少必要信息，请先获取版本或手动输入版本');
                    return;
                }

                const url = buildDownloadUrl(currentPublisher, currentExtension, currentVersion);
                const filename = `${currentPublisher}.${currentExtension}-${currentVersion}.vsix`;

                setStatus('loading', '正在准备下载...');
                btnDownload.disabled = true;

                try {
                    // 尝试 fetch 下载（可捕获服务端错误）
                    const response = await fetch(url, {
                        method: 'GET',
                        redirect: 'follow',
                        // 不设置 mode 默认 cors，可能会因跨域失败，但若失败则回退
                    });

                    if (!response.ok) {
                        // 解析错误信息
                        let errorMsg = `下载失败 (HTTP ${response.status})`;
                        try {
                            const errorData = await response.json();
                            if (errorData.message) {
                                errorMsg = errorData.message;
                            }
                        } catch (_) {
                            // 非JSON，尝试获取文本
                            try {
                                const text = await response.text();
                                if (text) errorMsg = text.slice(0, 200);
                            } catch (_) {}
                        }
                        setStatus('error', `❌ ${errorMsg}`);
                        btnDownload.disabled = false;
                        return;
                    }

                    // 获取 blob
                    const blob = await response.blob();
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(link.href);
                    setStatus('success', `✅ 下载完成：${filename}`);
                    btnDownload.disabled = false;
                    return;

                } catch (err) {
                    // 跨域或其他网络错误 → 回退到 a 标签下载
                    console.warn('Fetch failed, fallback to direct download:', err);
                    setStatus('info', '使用直接下载方式，若失败请尝试「复制链接」到浏览器打开或稍后重试');
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    link.target = '_blank';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    // 无法确定下载状态，稍后重置按钮
                    setTimeout(() => {
                        btnDownload.disabled = false;
                        // 但状态保留，不覆盖用户看到的信息
                    }, 500);
                    return;
                }
            }

            // ===== 事件绑定 =====

            // 获取版本
            btnFetch.addEventListener('click', handleFetch);
            inputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleFetch();
                }
            });

            // 快捷示例
            document.querySelectorAll('[data-example]').forEach(el => {
                el.addEventListener('click', () => {
                    inputEl.value = el.dataset.example;
                    handleFetch();
                });
            });

            // 版本下拉
            versionSelect.addEventListener('change', () => {
                const val = versionSelect.value;
                if (val) {
                    currentVersion = val;
                    manualVersion.value = '';
                    enableActions();
                    setStatus('info', `已选择版本：${val}`);
                } else {
                    currentVersion = '';
                    enableActions();
                }
            });

            // 手动输入
            btnUseManual.addEventListener('click', () => {
                const val = manualVersion.value.trim();
                if (!val) {
                    setStatus('error', '请输入版本号');
                    return;
                }
                if (allVersions.length > 0 && !allVersions.includes(val)) {
                    setStatus('info', `使用手动版本：${val}（不在获取的版本列表中）`);
                } else {
                    setStatus('success', `使用版本：${val}`);
                }
                currentVersion = val;
                if (allVersions.includes(val)) {
                    versionSelect.value = val;
                } else {
                    versionSelect.value = '';
                }
                enableActions();
            });

            manualVersion.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    btnUseManual.click();
                }
            });

            // 下载
            btnDownload.addEventListener('click', handleDownload);

            // 复制链接
            btnCopyLink.addEventListener('click', async () => {
                if (!currentPublisher || !currentExtension || !currentVersion) {
                    setStatus('error', '缺少必要信息，请先获取版本或手动输入版本');
                    return;
                }
                const url = buildDownloadUrl(currentPublisher, currentExtension, currentVersion);
                try {
                    await navigator.clipboard.writeText(url);
                    setStatus('success', '✅ 下载链接已复制到剪贴板');
                    btnCopyLink.classList.remove('flash-success');
                    void btnCopyLink.offsetWidth;
                    btnCopyLink.classList.add('flash-success');
                } catch (_) {
                    const textarea = document.createElement('textarea');
                    textarea.value = url;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    setStatus('success', '✅ 下载链接已复制到剪贴板');
                }
            });

            // 打开市场页
            btnOpenMarket.addEventListener('click', () => {
                if (!currentPublisher || !currentExtension) {
                    setStatus('error', '缺少发布者或扩展名');
                    return;
                }
                const url = buildMarketUrl(currentPublisher, currentExtension);
                window.open(url, '_blank');
            });

            // ===== 初始化 =====
            resetUI();
            hideStatus();
            setInfo('—', '—');
            inputEl.focus();

            const urlParams = new URLSearchParams(window.location.search);
            const q = urlParams.get('q');
            if (q) {
                inputEl.value = q;
                handleFetch();
            } else {
                setStatus('info', '输入扩展标识或市场 URL，点击「获取版本」');
            }

            console.log('VSIX 下载器已加载 (增强下载)');
        })();
    </script>
</body>
</html>
