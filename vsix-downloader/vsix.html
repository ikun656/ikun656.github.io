<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSIX 下载加速器</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f4f9; padding: 30px 20px; color: #1e293b; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); padding: 30px 35px; }
        h1 { font-size: 28px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
        .sub { color: #64748b; font-size: 15px; margin-bottom: 25px; border-left: 4px solid #2563eb; padding-left: 14px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .input-group input { flex: 1; min-width: 200px; padding: 12px 16px; border: 2px solid #d1d9e6; border-radius: 8px; font-size: 15px; background: #fafcfe; }
        .input-group input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.2s; background: #e9edf4; color: #1e293b; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        .btn-success { background: #28a745; color: #fff; }
        .btn-success:hover { background: #1e7e34; }
        .btn-outline { background: transparent; color: #2563eb; border: 2px solid #2563eb; }
        .btn-outline:hover { background: #e6f2fc; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; font-size: 13px; color: #64748b; }
        .examples span { cursor: pointer; color: #2563eb; background: #e6f2fc; padding: 2px 12px; border-radius: 20px; font-weight: 500; transition: 0.2s; }
        .examples span:hover { background: #c7e0f7; color: #005a9e; }
        .status { padding: 12px 16px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; display: none; align-items: center; gap: 10px; border-left: 4px solid transparent; }
        .status.show { display: flex; }
        .status.info { background: #e7f3ff; border-left-color: #2563eb; color: #00457e; }
        .status.success { background: #e6f9ed; border-left-color: #28a745; color: #155724; }
        .status.error { background: #fde8e8; border-left-color: #dc3545; color: #721c24; }
        .status.loading { background: #f0f2f5; border-left-color: #6c757d; color: #3d3d3d; }
        .status .spinner { width: 18px; height: 18px; border: 2.5px solid #d1d9e6; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; background: #f8fafc; border-radius: 8px; padding: 16px 18px; border: 1px solid #e2e8f0; }
        .info-grid .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; font-weight: 600; }
        .info-grid .value { font-size: 15px; font-weight: 500; word-break: break-all; font-family: 'SF Mono', 'Consolas', monospace; }
        .version-section { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; padding: 12px 0 4px; border-top: 1px solid #e2e8f0; }
        .version-section select { flex: 1; min-width: 140px; padding: 10px 14px; border: 2px solid #d1d9e6; border-radius: 8px; font-size: 14px; background: #fff; cursor: pointer; }
        .version-section select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
        .version-section .manual-input { display: flex; gap: 8px; flex: 1; min-width: 130px; }
        .version-section .manual-input input { flex: 1; min-width: 80px; padding: 10px 12px; border: 2px solid #d1d9e6; border-radius: 8px; font-size: 14px; background: #fafcfe; }
        .version-section .manual-input input:focus { outline: none; border-color: #2563eb; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
        .actions .btn { flex: 1; min-width: 120px; padding: 14px 20px; font-size: 15px; }
        .footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid #e2e8f0; font-size: 13px; color: #64748b; text-align: center; }

        /* 闪动效果 */
        .flash-success {
            animation: flashGreen 0.6s ease;
        }
        @keyframes flashGreen {
            0%, 100% { background: transparent; }
            50% { background: #d4edda; }
        }
    </style>
</head>
<body>

    <!-- ===== 页面主体 ===== -->
    <div class="container">
        <h1>VSIX 下载加速器</h1>
        <div class="sub">从 Visual Studio Marketplace 获取扩展的 VSIX 安装包</div>

        <div class="input-group">
            <input type="text" id="inputExtension" placeholder="例如：ms-dotnettools.csharp 或 完整URL" autofocus spellcheck="false" />
            <button class="btn btn-primary" id="btnFetch">🔍 获取版本</button>
        </div>
        <div class="examples">
            <span>试试：</span>
            <span data-example="ms-dotnettools.csharp">C#</span>
            <span data-example="ms-vscode.vscode-js-debug">JS Debug</span>
            <span data-example="ms-python.python">Python</span>
            <span data-example="GitHub.copilot">Copilot</span>
            <span data-example="ms-vscode.cpptools">C++</span>
        </div>

        <div class="status" id="status"><span id="statusIcon"></span><span id="statusText">就绪</span></div>

        <div class="info-grid">
            <div class="item"><span class="label">发布者 (Publisher)</span><span class="value" id="displayPublisher">—</span></div>
            <div class="item"><span class="label">扩展名 (Extension)</span><span class="value" id="displayExtension">—</span></div>
        </div>

        <div class="version-section">
            <label for="versionSelect">📦 版本</label>
            <select id="versionSelect" disabled><option value="">— 请先获取版本 —</option></select>
            <div class="manual-input">
                <input type="text" id="manualVersion" placeholder="或手动输入版本" spellcheck="false" />
                <button class="btn" id="btnUseManual">使用</button>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-success" id="btnDownload" disabled><span class="icon">⬇</span> 下载 VSIX</button>
            <button class="btn btn-outline" id="btnCopyLink" disabled><span class="icon">📋</span> 复制链接</button>
            <button class="btn" id="btnOpenMarket" disabled><span class="icon">🌐</span> 市场页</button>
        </div>

        <div class="footer">数据来自 Visual Studio Marketplace</div>
    </div>

    <!-- 引入 policy.js（自包含弹窗） -->
    <script src="/policy.js"></script>

    <script>
        (function() {
            'use strict';

            // ===== DOM 引用 =====
            const inputEl = document.getElementById('inputExtension');
            const btnFetch = document.getElementById('btnFetch');
            const statusEl = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const statusIcon = document.getElementById('statusIcon');
            const displayPublisher = document.getElementById('displayPublisher');
            const displayExtension = document.getElementById('displayExtension');
            const versionSelect = document.getElementById('versionSelect');
            const manualVersion = document.getElementById('manualVersion');
            const btnUseManual = document.getElementById('btnUseManual');
            const btnDownload = document.getElementById('btnDownload');
            const btnCopyLink = document.getElementById('btnCopyLink');
            const btnOpenMarket = document.getElementById('btnOpenMarket');

            // ===== 状态 =====
            let currentPublisher = '';
            let currentExtension = '';
            let currentVersion = '';
            let allVersions = [];
            let isFetching = false;

            // ===== 工具函数 =====
            function setStatus(type, message, extra) {
                statusEl.className = 'status show ' + type;
                statusText.textContent = message;
                if (type === 'loading') {
                    statusIcon.innerHTML = '<span class="spinner"></span>';
                } else if (type === 'success') {
                    statusIcon.textContent = '✅';
                } else if (type === 'error') {
                    statusIcon.textContent = '❌';
                } else if (type === 'info') {
                    statusIcon.textContent = 'ℹ️';
                } else {
                    statusIcon.textContent = '';
                }
                if (extra) statusText.textContent += ' ' + extra;
            }

            function hideStatus() {
                statusEl.className = 'status';
                statusText.textContent = '';
                statusIcon.textContent = '';
            }

            function setInfo(publisher, extension) {
                displayPublisher.textContent = publisher || '—';
                displayExtension.textContent = extension || '—';
                currentPublisher = publisher || '';
                currentExtension = extension || '';
            }

            function resetUI() {
                versionSelect.innerHTML = '<option value="">— 请先获取版本 —</option>';
                versionSelect.disabled = true;
                manualVersion.value = '';
                currentVersion = '';
                btnDownload.disabled = true;
                btnCopyLink.disabled = true;
                btnOpenMarket.disabled = true;
                allVersions = [];
            }

            function enableActions() {
                const hasVersion = currentVersion && currentPublisher && currentExtension;
                btnDownload.disabled = !hasVersion;
                btnCopyLink.disabled = !hasVersion;
                btnOpenMarket.disabled = !(currentPublisher && currentExtension);
            }

            function buildMarketUrl(publisher, extension) {
                return `https://marketplace.visualstudio.com/items?itemName=${publisher}.${extension}`;
            }

            function buildDownloadUrl(publisher, extension, version) {
                return `https://marketplace.visualstudio.com/_apis/public/gallery/publishers/${publisher}/vsextensions/${extension}/${version}/vspackage`;
            }

            // ===== 解析输入 =====
            function parseInput(raw) {
                let str = raw.trim();
                if (!str) return null;
                if (str.includes('itemName=')) {
                    try {
                        const url = new URL(str);
                        const param = url.searchParams.get('itemName');
                        if (param) str = param;
                    } catch (_) {}
                }
                str = str.replace(/\/+$/, '');
                const parts = str.split('.');
                if (parts.length >= 2) {
                    const publisher = parts[0];
                    const extension = parts.slice(1).join('.');
                    if (publisher && extension) return { publisher, extension };
                }
                if (str.includes('/')) {
                    const parts2 = str.split('/').filter(Boolean);
                    if (parts2.length >= 2) {
                        return { publisher: parts2[0], extension: parts2.slice(1).join('.') };
                    }
                }
                return null;
            }

            // ===== 获取版本（增强版，带多个代理和重试） =====
            async function fetchVersions(publisher, extension) {
                const apiUrl = `https://marketplace.visualstudio.com/_apis/public/gallery/publishers/${publisher}/vsextensions/${extension}`;

                // 代理列表（按优先级排列，越靠前越优先使用）
                const proxyList = [
                    // 1. 直接请求（如果支持 CORS）
                    (url) => url,
                    // 2. 常用代理
                    (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                    (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                    (url) => `https://cors-anywhere.herokuapp.com/${url}`,
                ];

                let lastError = null;

                for (const proxyFn of proxyList) {
                    try {
                        const targetUrl = proxyFn(apiUrl);
                        const controller = new AbortController();
                        const timeout = setTimeout(() => controller.abort(), 15000); // 15秒超时
                        const resp = await fetch(targetUrl, { signal: controller.signal });
                        clearTimeout(timeout);
                        if (resp.ok) {
                            return await resp.json();
                        } else {
                            // 如果状态码非200，记录错误但继续尝试下一个
                            lastError = `HTTP ${resp.status}`;
                            continue;
                        }
                    } catch (err) {
                        lastError = err.message || '网络错误';
                        // 继续尝试下一个代理
                        continue;
                    }
                }

                throw new Error(`所有请求方式均失败，最后错误：${lastError}。请检查网络或手动输入版本号。`);
            }

            // ===== 提取版本列表 =====
            function extractVersions(data) {
                if (!data) return [];
                let versions = [];
                if (Array.isArray(data.versions)) {
                    versions = data.versions.map(v => v.version).filter(Boolean);
                }
                if (Array.isArray(data) && versions.length === 0) {
                    versions = data.map(v => v.version || v).filter(Boolean);
                }
                if (data.results && Array.isArray(data.results) && versions.length === 0) {
                    for (const result of data.results) {
                        if (result.versions && Array.isArray(result.versions)) {
                            versions = result.versions.map(v => v.version).filter(Boolean);
                            break;
                        }
                    }
                }
                const unique = [...new Set(versions)];
                return unique.sort((a, b) => {
                    const partsA = a.split('.').map(Number);
                    const partsB = b.split('.').map(Number);
                    for (let i = 0; i < Math.max(partsA.length, partsB.length); i++) {
                        const na = partsA[i] || 0;
                        const nb = partsB[i] || 0;
                        if (na !== nb) return nb - na;
                    }
                    return 0;
                });
            }

            // ===== 更新版本下拉 =====
            function populateVersionSelect(versions, selectedVersion) {
                versionSelect.innerHTML = '';
                if (!versions || versions.length === 0) {
                    versionSelect.innerHTML = '<option value="">— 无可用版本 —</option>';
                    versionSelect.disabled = true;
                    return;
                }
                allVersions = versions;
                let hasSelected = false;
                for (const v of versions) {
                    const opt = document.createElement('option');
                    opt.value = v;
                    opt.textContent = v;
                    if (selectedVersion && v === selectedVersion) {
                        opt.selected = true;
                        hasSelected = true;
                    }
                    versionSelect.appendChild(opt);
                }
                if (!hasSelected && versions.length > 0) {
                    versionSelect.value = versions[0];
                    currentVersion = versions[0];
                } else if (hasSelected) {
                    currentVersion = selectedVersion;
                } else {
                    currentVersion = '';
                }
                versionSelect.disabled = false;
                enableActions();
            }

            // ===== 主流程：获取版本 =====
            async function handleFetch() {
                if (isFetching) return;
                const raw = inputEl.value.trim();
                if (!raw) {
                    setStatus('error', '请输入扩展标识或市场 URL');
                    inputEl.focus();
                    return;
                }
                const parsed = parseInput(raw);
                if (!parsed) {
                    setStatus('error', '无法解析输入，请使用 "publisher.extension" 格式或完整市场 URL');
                    return;
                }
                const { publisher, extension } = parsed;
                setInfo(publisher, extension);
                resetUI();
                setStatus('loading', `正在获取 ${publisher}.${extension} 的版本列表...`);
                isFetching = true;
                btnFetch.disabled = true;
                btnFetch.textContent = '⏳ 获取中...';

                try {
                    const data = await fetchVersions(publisher, extension);
                    const versions = extractVersions(data);
                    if (versions.length === 0) {
                        setStatus('error', '未找到任何版本，请检查扩展名称是否正确，或手动输入版本');
                        versionSelect.innerHTML = '<option value="">— 无版本 —</option>';
                        versionSelect.disabled = true;
                        enableActions();
                        btnFetch.disabled = false;
                        btnFetch.textContent = '🔍 获取版本';
                        isFetching = false;
                        return;
                    }
                    const latest = versions[0];
                    populateVersionSelect(versions, latest);
                    setStatus('success', `✅ 获取成功！共 ${versions.length} 个版本，最新版本：${latest}`);
                    btnFetch.textContent = '🔄 刷新';
                    enableActions();
                } catch (err) {
                    console.warn('Fetch error:', err);
                    setStatus('error', `获取失败：${err.message || '未知错误'}。请手动输入版本号。`);
                    versionSelect.innerHTML = '<option value="">— 请手动输入 —</option>';
                    versionSelect.disabled = true;
                    // 保留手动输入可能性
                    if (manualVersion.value.trim()) {
                        currentVersion = manualVersion.value.trim();
                        enableActions();
                    } else {
                        enableActions();
                    }
                } finally {
                    isFetching = false;
                    btnFetch.disabled = false;
                    if (btnFetch.textContent === '⏳ 获取中...') {
                        btnFetch.textContent = '🔍 获取版本';
                    }
                }
            }

            // ===== 下载（优先 fetch，失败降级） =====
            async function handleDownload() {
                if (!currentPublisher || !currentExtension || !currentVersion) {
                    setStatus('error', '缺少必要信息，请先获取版本或手动输入版本');
                    return;
                }
                const url = buildDownloadUrl(currentPublisher, currentExtension, currentVersion);
                const filename = `${currentPublisher}.${currentExtension}-${currentVersion}.vsix`;
                setStatus('loading', '正在准备下载...');
                btnDownload.disabled = true;

                try {
                    const response = await fetch(url, { method: 'GET', redirect: 'follow' });
                    if (!response.ok) {
                        let errorMsg = `下载失败 (HTTP ${response.status})`;
                        try {
                            const errorData = await response.json();
                            if (errorData.message) errorMsg = errorData.message;
                        } catch (_) {
                            try {
                                const text = await response.text();
                                if (text) errorMsg = text.slice(0, 200);
                            } catch (_) {}
                        }
                        setStatus('error', `❌ ${errorMsg}`);
                        btnDownload.disabled = false;
                        return;
                    }
                    const blob = await response.blob();
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(link.href);
                    setStatus('success', `✅ 下载完成：${filename}`);
                    btnDownload.disabled = false;
                } catch (err) {
                    console.warn('Fetch failed, fallback to direct link:', err);
                    setStatus('info', '尝试直接下载，若失败请复制链接到浏览器打开');
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    link.target = '_blank';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => {
                        btnDownload.disabled = false;
                    }, 500);
                }
            }

            // ===== 事件绑定 =====

            // 获取版本
            btnFetch.addEventListener('click', handleFetch);
            inputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleFetch();
                }
            });

            // 快捷示例
            document.querySelectorAll('[data-example]').forEach(el => {
                el.addEventListener('click', () => {
                    inputEl.value = el.dataset.example;
                    handleFetch();
                });
            });

            // 版本下拉
            versionSelect.addEventListener('change', () => {
                const val = versionSelect.value;
                if (val) {
                    currentVersion = val;
                    manualVersion.value = '';
                    enableActions();
                    setStatus('info', `已选择版本：${val}`);
                } else {
                    currentVersion = '';
                    enableActions();
                }
            });

            // 手动输入
            btnUseManual.addEventListener('click', () => {
                const val = manualVersion.value.trim();
                if (!val) {
                    setStatus('error', '请输入版本号');
                    return;
                }
                if (allVersions.length > 0 && !allVersions.includes(val)) {
                    setStatus('info', `使用手动版本：${val}（不在获取的版本列表中）`);
                } else {
                    setStatus('success', `使用版本：${val}`);
                }
                currentVersion = val;
                if (allVersions.includes(val)) {
                    versionSelect.value = val;
                } else {
                    versionSelect.value = '';
                }
                enableActions();
            });
            manualVersion.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    btnUseManual.click();
                }
            });

            // 下载
            btnDownload.addEventListener('click', handleDownload);

            // 复制链接
            btnCopyLink.addEventListener('click', async () => {
                if (!currentPublisher || !currentExtension || !currentVersion) {
                    setStatus('error', '缺少必要信息，请先获取版本或手动输入版本');
                    return;
                }
                const url = buildDownloadUrl(currentPublisher, currentExtension, currentVersion);
                try {
                    await navigator.clipboard.writeText(url);
                    setStatus('success', '✅ 下载链接已复制到剪贴板');
                    btnCopyLink.classList.remove('flash-success');
                    void btnCopyLink.offsetWidth;
                    btnCopyLink.classList.add('flash-success');
                } catch (_) {
                    const textarea = document.createElement('textarea');
                    textarea.value = url;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    setStatus('success', '✅ 下载链接已复制到剪贴板');
                }
            });

            // 打开市场页
            btnOpenMarket.addEventListener('click', () => {
                if (!currentPublisher || !currentExtension) {
                    setStatus('error', '缺少发布者或扩展名');
                    return;
                }
                const url = buildMarketUrl(currentPublisher, currentExtension);
                window.open(url, '_blank');
            });

            // ===== 初始化 =====
            resetUI();
            hideStatus();
            setInfo('—', '—');
            inputEl.focus();

            const urlParams = new URLSearchParams(window.location.search);
            const q = urlParams.get('q');
            if (q) {
                inputEl.value = q;
                handleFetch();
            } else {
                setStatus('info', '输入扩展标识或市场 URL，点击「获取版本」');
            }

            console.log('VSIX 下载器已启动 (修复版)');
        })();
    </script>
</body>
</html>
