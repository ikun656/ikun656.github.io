<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 编解码</title>
    <link rel="stylesheet" href="/theme.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); padding: 40px 20px; color: var(--text); transition: background .2s, color .2s; }
        .container { max-width: 900px; margin: 0 auto; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 30px 35px; transition: background .2s; }
        h1 { font-size: 28px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; color: var(--text-strong); }
        .sub { color: var(--text-muted); font-size: 15px; margin-bottom: 25px; border-left: 4px solid var(--accent-bar); padding-left: 14px; }
        .ico { display: inline-block; width: 1.1em; height: 1.1em; flex-shrink: 0; background-color: currentColor; -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; vertical-align: -0.15em; }
        .btn .ico { margin-right: 6px; }

        .tool-area textarea { width: 100%; height: 180px; padding: 12px; border: 2px solid var(--border-strong); border-radius: 8px; font-family: 'SF Mono', 'Consolas', monospace; font-size: 14px; resize: vertical; transition: border .2s; background: var(--surface); color: var(--text); }
        .tool-area textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        .option-row { margin: 12px 0; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .option-row label { font-size: 14px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
        .option-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); }

        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
        .btn { padding: 8px 20px; border: none; border-radius: 30px; font-weight: 500; cursor: pointer; transition: background .2s; background: var(--btn-bg); color: var(--text); font-size: 14px; }
        .btn:hover { background: var(--btn-bg-hover); }
        .btn.primary { background: var(--primary); color: #fff; }
        .btn.primary:hover { background: var(--primary-hover); }
        .btn.success { background: var(--success); color: #fff; }
        .btn.success:hover { background: var(--success-hover); }
        .btn.danger { background: var(--danger); color: #fff; }
        .btn.danger:hover { background: var(--danger-hover); }

        .result-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 8px; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-family: 'SF Mono', 'Consolas', monospace; font-size: 14px; color: var(--text-strong); }
        .result-box.error { color: var(--danger); background: rgba(220,53,69,0.08); border-color: var(--danger); }
        .status-msg { font-size: 14px; color: var(--text-muted); margin: 6px 0 4px; }
        .status-msg.error { color: var(--danger); }
        .status-msg.success { color: var(--success); }
        #resultWrapper { margin-top: 12px; }

        .footer { margin-top: 30px; font-size: 13px; color: var(--text-soft); text-align: center; border-top: 1px solid var(--border); padding-top: 20px; }
        .tip { background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 14px; color: var(--text-muted); }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .container { padding: 22px 18px; }
            .btn-group .btn { flex: 1; min-width: 80px; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- ===== 政策遮罩由 /policy.js 自动注入 ===== -->

    <div class="container">
        <a href="../index.html" class="back-link">← 返回主页</a>
        <h1><span class="ico" style="--ico:url(../assets/icons/refresh-cw.svg)"></span> Base64 编解码</h1>
        <div class="sub">文本与 Base64 互转，支持 URL-safe 模式，全程在浏览器里跑</div>
        <div class="tip"><strong>提示：</strong> 编码/解码只在本地浏览器处理，不会上传任何内容。</div>

        <div class="tool-area">
            <textarea id="b64Input" placeholder="在此粘贴文本或 Base64 字符串…">ikun656 工具站</textarea>
            <div class="option-row">
                <label><input type="checkbox" id="urlSafe" /> URL-safe 模式（用 -_ 替换 +/，去掉填充 =）</label>
            </div>
            <div class="btn-group">
                <button class="btn primary" id="btnEncode"><span class="ico" style="--ico:url(../assets/icons/sparkles.svg)"></span> 编码</button>
                <button class="btn" id="btnDecode"><span class="ico" style="--ico:url(../assets/icons/minimize.svg)"></span> 解码</button>
                <button class="btn danger" id="btnClear"><span class="ico" style="--ico:url(../assets/icons/trash-2.svg)"></span> 清空</button>
            </div>
            <div id="b64Status" class="status-msg">等待操作…</div>
            <div style="display:none;" id="resultWrapper">
                <div id="b64Result" class="result-box"></div>
                <button class="btn" id="btnCopy" style="margin-top:8px;"><span class="ico" style="--ico:url(../assets/icons/copy.svg)"></span> 复制</button>
            </div>
        </div>

        <div class="footer">全程在浏览器里跑，不上传任何数据 · 访客 <span id="busuanzi_value_site_uv">-</span> · 浏览 <span id="busuanzi_value_site_pv">-</span></div>
    </div>

    <script src="/policy.js"></script>
    <script src="/theme.js"></script>
    <script>
        (function() {
            'use strict';

            var inputEl = document.getElementById('b64Input');
            var resultEl = document.getElementById('b64Result');
            var statusEl = document.getElementById('b64Status');
            var urlSafeEl = document.getElementById('urlSafe');
            var resultWrapper = document.getElementById('resultWrapper');
            var btnCopy = document.getElementById('btnCopy');

            function setStatus(msg, type) {
                statusEl.textContent = msg;
                statusEl.className = 'status-msg' + (type ? ' ' + type : '');
            }
            function showResult(text, isError) {
                resultEl.textContent = text || '';
                resultEl.className = 'result-box' + (isError ? ' error' : '');
                resultWrapper.style.display = 'block';
            }
            function hideResult() { resultWrapper.style.display = 'none'; resultEl.className = 'result-box'; }

            function toBase64(str) {
                // 处理 UTF-8：先编码为字节，再转 Base64
                var bytes = new TextEncoder().encode(str);
                var bin = '';
                for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
                return btoa(bin);
            }
            function fromBase64(b64) {
                var bin = atob(b64);
                var bytes = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                return new TextDecoder().decode(bytes);
            }

            document.getElementById('btnEncode').addEventListener('click', function() {
                var raw = inputEl.value;
                if (!raw) { setStatus('请输入要编码的内容', 'error'); return; }
                try {
                    var out = toBase64(raw);
                    if (urlSafeEl.checked) out = out.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                    showResult(out, false); setStatus('编码成功', 'success');
                } catch (e) { setStatus('编码失败: ' + e.message, 'error'); showResult(e.message, true); }
            });

            document.getElementById('btnDecode').addEventListener('click', function() {
                var raw = inputEl.value.trim();
                if (!raw) { setStatus('请输入要解码的 Base64', 'error'); return; }
                try {
                    var b64 = raw;
                    if (urlSafeEl.checked) {
                        b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
                        while (b64.length % 4) b64 += '=';
                    }
                    var out = fromBase64(b64);
                    showResult(out, false); setStatus('解码成功', 'success');
                } catch (e) { setStatus('解码失败：不是合法的 Base64', 'error'); showResult(e.message, true); }
            });

            document.getElementById('btnClear').addEventListener('click', function() {
                inputEl.value = ''; hideResult(); setStatus('已清空', '');
            });

            btnCopy.addEventListener('click', function() {
                var text = resultEl.textContent;
                if (!text) { setStatus('没有可复制的内容', 'error'); return; }
                navigator.clipboard.writeText(text).then(function() {
                    setStatus('已复制到剪贴板', 'success');
                }).catch(function() { setStatus('复制失败', 'error'); });
            });

            window.addEventListener('load', function() {
                setStatus('输入内容，点击编码或解码', '');
                hideResult();
            });
            console.log('Base64 编解码已启动');
        })();
    </script>
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
