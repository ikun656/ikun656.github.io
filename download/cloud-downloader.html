<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud 文件下载器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f9;
            padding: 40px 20px;
            color: #1e293b;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            padding: 30px 35px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sub {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 25px;
            border-left: 4px solid #2563eb;
            padding-left: 14px;
        }
        .control {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
            align-items: center;
        }
        .control label {
            font-weight: 500;
            color: #334155;
        }
        .control select {
            padding: 8px 16px;
            border: 2px solid #d1d9e6;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            cursor: pointer;
            flex: 1;
            min-width: 200px;
        }
        .control select:focus {
            outline: none;
            border-color: #2563eb;
        }
        .btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 15px;
        }
        .btn:hover {
            background: #1d4ed8;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            margin: 10px 0 18px;
            padding: 10px 16px;
            border-radius: 8px;
            background: #f1f5f9;
            color: #475569;
            font-size: 14px;
            display: none;
        }
        .status.show {
            display: block;
        }
        .status.error {
            background: #fde8e8;
            color: #721c24;
        }
        .status.success {
            background: #e6f9ed;
            color: #155724;
        }
        .file-list {
            margin-top: 10px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #eef2f8;
            transition: background 0.15s;
        }
        .file-item:hover {
            background: #fafcff;
        }
        .file-item .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .file-item .name {
            font-weight: 500;
            color: #0f172a;
            word-break: break-all;
        }
        .file-item .size {
            font-size: 13px;
            color: #94a3b8;
        }
        .file-item .download-link {
            background: #eef2f8;
            color: #1e293b;
            padding: 6px 16px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .file-item .download-link:hover {
            background: #d5dce4;
        }
        .empty {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
        }
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid #eef2f8;
            padding-top: 20px;
        }
        .tip {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #475569;
        }
        .tip code {
            background: #eef2f8;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📂 Cloud 文件下载器</h1>
    <div class="sub">列出 <code>cloud</code> 目录下的所有文件，支持代理加速下载</div>

    <!-- 提示仅针对下载 -->
    <div class="tip">
        💡 <strong>代理说明：</strong> 代理仅用于文件下载加速，获取文件列表时始终直连，保证列表刷新速度不受代理影响。
    </div>

    <div class="control">
        <label for="proxySelect">下载代理：</label>
        <select id="proxySelect">
            <option value="">不使用代理</option>
            <option value="https://v4.gh-proxy.org/" selected>https://v4.gh-proxy.org/</option>
            <option value="https://ghproxy.com/">https://ghproxy.com/</option>
            <option value="https://gh.api.99988866.xyz/">https://gh.api.99988866.xyz/</option>
            <option value="https://gh.ddlc.top/">https://gh.ddlc.top/</option>
        </select>
        <button class="btn" id="refreshBtn">🔄 刷新列表</button>
    </div>

    <div class="status" id="status"></div>

    <div class="file-list" id="fileList">
        <div class="empty">点击「刷新列表」加载文件</div>
    </div>

    <div class="footer">
        <span>仓库：ikun656/ikun656.github.io · 目录：/cloud</span>
    </div>
</div>

<script>
    (function() {
        // ===== 配置 =====
        const REPO_OWNER = 'ikun656';
        const REPO_NAME = 'ikun656.github.io';
        const DIR_PATH = 'cloud';   // 要列出的目录

        // ===== DOM 元素 =====
        const proxySelect = document.getElementById('proxySelect');
        const refreshBtn = document.getElementById('refreshBtn');
        const statusEl = document.getElementById('status');
        const fileListEl = document.getElementById('fileList');

        // ===== 工具函数 =====
        function setStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = 'status show' + (type ? ' ' + type : '');
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function getFileSize(file) {
            return file.size !== undefined ? formatSize(file.size) : '未知';
        }

        // ===== 获取文件列表（始终直连，不使用代理） =====
        async function fetchFileList() {
            const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DIR_PATH}`;
            // 注意：此处未使用代理，始终直连 GitHub API

            setStatus('⏳ 正在获取文件列表...', '');
            refreshBtn.disabled = true;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    let errMsg = `HTTP ${response.status}`;
                    try {
                        const data = await response.json();
                        if (data.message) errMsg = data.message;
                    } catch (_) {}
                    throw new Error(errMsg);
                }

                const data = await response.json();
                if (!Array.isArray(data)) {
                    throw new Error('返回数据格式异常');
                }

                const files = data.filter(item => item.type === 'file');

                if (files.length === 0) {
                    setStatus('⚠️ cloud 目录为空，请上传文件', 'error');
                    fileListEl.innerHTML = `<div class="empty">暂无文件</div>`;
                    return;
                }

                // 渲染列表（传入代理选择值用于下载链接）
                renderFileList(files);

                setStatus(`✅ 成功加载 ${files.length} 个文件`, 'success');
            } catch (err) {
                console.error(err);
                setStatus(`❌ 加载失败：${err.message}`, 'error');
                fileListEl.innerHTML = `<div class="empty">加载失败，请检查网络</div>`;
            } finally {
                refreshBtn.disabled = false;
            }
        }

        // ===== 渲染文件列表（下载链接应用代理） =====
        function renderFileList(files) {
            const proxy = proxySelect.value.trim();

            let html = '';
            for (const file of files) {
                const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${DIR_PATH}/${file.name}`;
                let downloadUrl = rawUrl;
                if (proxy) {
                    downloadUrl = proxy + rawUrl;
                }

                html += `
                    <div class="file-item">
                        <div class="info">
                            <span class="name">📄 ${file.name}</span>
                            <span class="size">${getFileSize(file)}</span>
                        </div>
                        <a href="${downloadUrl}" class="download-link" download target="_blank">⬇ 下载</a>
                    </div>
                `;
            }
            fileListEl.innerHTML = html;
        }

        // ===== 事件绑定 =====
        refreshBtn.addEventListener('click', fetchFileList);

        // 代理切换时重新渲染列表（仅更新下载链接，不重新请求 API）
        proxySelect.addEventListener('change', function() {
            // 如果已有文件列表，重新渲染
            const items = fileListEl.querySelectorAll('.file-item');
            if (items.length > 0) {
                // 重新获取当前已显示的文件列表（从 DOM 中提取文件名，但无法获取 size，简单做法是重新请求）
                // 更稳妥：重新请求 API 并渲染
                fetchFileList();
            }
        });

        // 页面加载时自动刷新
        window.addEventListener('load', fetchFileList);

        console.log('Cloud 文件下载器已启动（列表直连，下载加速）');
    })();
</script>
</body>
</html>
