<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud 文件下载器</title>
    <style>
        /* ===== 原有样式 ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; padding: 40px 20px; color: #1e293b; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); padding: 30px 35px; }
        h1 { font-size: 28px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
        .sub { color: #64748b; font-size: 15px; margin-bottom: 25px; border-left: 4px solid #2563eb; padding-left: 14px; }
        .control { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 25px; align-items: center; }
        .control label { font-weight: 500; color: #334155; }
        .control select { padding: 8px 16px; border: 2px solid #d1d9e6; border-radius: 8px; font-size: 14px; background: #fff; cursor: pointer; flex: 1; min-width: 200px; }
        .control select:focus { outline: none; border-color: #2563eb; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 8px 24px; border-radius: 30px; font-weight: 500; cursor: pointer; transition: background 0.2s; font-size: 15px; }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .ico { display: inline-block; width: 1.1em; height: 1.1em; flex-shrink: 0; background-color: currentColor; -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; vertical-align: -0.15em; }
        .btn .ico, .download-btn .ico, .direct-link .ico { margin-right: 6px; }
        .status { margin: 10px 0 18px; padding: 10px 16px; border-radius: 8px; background: #f1f5f9; color: #475569; font-size: 14px; display: none; }
        .status.show { display: block; }
        .status.error { background: #fde8e8; color: #721c24; }
        .status.success { background: #e6f9ed; color: #155724; }
        .file-list { margin-top: 10px; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #eef2f8; transition: background 0.15s; flex-wrap: wrap; gap: 10px; }
        .file-item:hover { background: #fafcff; }
        .file-item .info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 150px; }
        .file-item .name { font-weight: 500; color: #0f172a; word-break: break-all; }
        .file-item .size { font-size: 13px; color: #94a3b8; }
        .file-item .actions { display: flex; gap: 8px; align-items: center; }
        .file-item .download-btn { background: #2563eb; color: #fff; border: none; padding: 6px 16px; border-radius: 30px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
        .file-item .download-btn:hover { background: #1d4ed8; }
        .file-item .download-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .file-item .direct-link { font-size: 13px; color: #94a3b8; text-decoration: none; padding: 4px 8px; border: 1px solid #d1d9e6; border-radius: 20px; transition: background 0.2s; }
        .file-item .direct-link:hover { background: #f1f5f9; }
        .empty { text-align: center; color: #94a3b8; padding: 40px 0; }
        .footer { margin-top: 30px; font-size: 13px; color: #94a3b8; text-align: center; border-top: 1px solid #eef2f8; padding-top: 20px; }
        .tip { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 14px; color: #475569; }

        /* ===== 政策弹窗样式 ===== */
        .policy-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .policy-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .policy-card {
            background: #fff;
            max-width: 680px;
            width: 90%;
            max-height: 85vh;
            border-radius: 24px;
            padding: 32px 36px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.3);
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.3s;
        }
        .policy-overlay.show .policy-card {
            transform: scale(1);
        }
        .policy-card h2 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .policy-card .policy-text {
            font-size: 15px;
            line-height: 1.7;
            color: #334155;
            margin-bottom: 20px;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid #eef2f8;
            border-radius: 12px;
            padding: 16px;
            background: #f8fafc;
            max-height: 300px;
            overflow-y: auto;
        }
        .policy-card .policy-text strong {
            color: #2563eb;
        }
        .policy-card .btn-agree {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 14px 40px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .policy-card .btn-agree:hover {
            background: #1d4ed8;
        }
        @media (max-width: 480px) {
            .policy-card { padding: 24px 20px; }
            .policy-card h2 { font-size: 20px; }
        }
    </style>
</head>
<body>


    <!-- ===== 页面主体 ===== -->
    <div class="container">
        <h1>Cloud 文件下载器</h1>
        <div class="sub">列出 <code>cloud</code> 目录下的所有文件，支持代理加速下载</div>
        <div class="tip"><strong>代理说明：</strong> 代理只用来加速下载；拉文件列表时一直走直连。</div>

        <div class="control">
            <label for="proxySelect">下载代理：</label>
            <select id="proxySelect">
                <option value="">不使用代理</option>
                <option value="https://v4.gh-proxy.org/" selected>https://v4.gh-proxy.org/</option>
                <option value="https://ghproxy.com/">https://ghproxy.com/</option>
                <option value="https://gh.api.99988866.xyz/">https://gh.api.99988866.xyz/</option>
                <option value="https://gh.ddlc.top/">https://gh.ddlc.top/</option>
            </select>
            <button class="btn" id="refreshBtn"><span class="ico" style="--ico:url(../assets/icons/refresh-cw.svg)"></span> 刷新列表</button>
        </div>

        <div class="status" id="status"></div>

        <div class="file-list" id="fileList"><div class="empty">点击「刷新列表」加载文件</div></div>

        <div class="footer">仓库：ikun656/ikun656.github.io · 目录：/cloud · 访客 <span id="busuanzi_value_site_uv">-</span> · 浏览 <span id="busuanzi_value_site_pv">-</span></div>
    </div>

    <!-- ===== 引入独立的 policy.js ===== -->
    <script src="/policy.js"></script>

    <!-- ===== 原有业务 JS ===== -->
    <script>
        (function() {
            'use strict';

            // 原有 Cloud 下载器逻辑（完整功能）
            const REPO_OWNER = 'ikun656';
            const REPO_NAME = 'ikun656.github.io';
            const DIR_PATH = 'cloud';
            const proxySelect = document.getElementById('proxySelect');
            const refreshBtn = document.getElementById('refreshBtn');
            const statusEl = document.getElementById('status');
            const fileListEl = document.getElementById('fileList');

            function setStatus(msg, type) {
                statusEl.textContent = msg;
                statusEl.className = 'status show' + (type ? ' ' + type : '');
            }
            function formatSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            function getFileSize(file) {
                return file.size !== undefined ? formatSize(file.size) : '未知';
            }

            async function fetchFileList() {
                const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DIR_PATH}`;
                setStatus('正在获取文件列表...', '');
                refreshBtn.disabled = true;
                try {
                    const response = await fetch(apiUrl);
                    if (!response.ok) {
                        let errMsg = `HTTP ${response.status}`;
                        try {
                            const data = await response.json();
                            if (data.message) errMsg = data.message;
                        } catch (_) {}
                        throw new Error(errMsg);
                    }
                    const data = await response.json();
                    if (!Array.isArray(data)) throw new Error('返回数据格式异常');
                    const files = data.filter(item => item.type === 'file');
                    if (files.length === 0) {
                        setStatus('cloud 目录为空', 'error');
                        fileListEl.innerHTML = `<div class="empty">暂无文件</div>`;
                        return;
                    }
                    renderFileList(files);
                    setStatus(`成功加载 ${files.length} 个文件`, 'success');
                } catch (err) {
                    setStatus(`加载失败：${err.message}`, 'error');
                    fileListEl.innerHTML = `<div class="empty">加载失败，请检查网络</div>`;
                } finally {
                    refreshBtn.disabled = false;
                }
            }

            function downloadFile(url, filename) {
                const proxy = proxySelect.value.trim();
                let targetUrl = url;
                if (proxy) targetUrl = proxy + url;
                fetch(targetUrl, { mode: 'cors' })
                    .then(response => {
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        return response.blob();
                    })
                    .then(blob => {
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = filename;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        setTimeout(() => URL.revokeObjectURL(link.href), 10000);
                    })
                    .catch(err => {
                        console.warn('Fetch 下载失败，降级到 window.open:', err);
                        window.open(targetUrl, '_blank');
                    });
            }

            function renderFileList(files) {
                let html = '';
                for (const file of files) {
                    const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${DIR_PATH}/${file.name}`;
                    html += `
                        <div class="file-item">
                            <div class="info">
                                <span class="name">📄 ${file.name}</span>
                                <span class="size">${getFileSize(file)}</span>
                            </div>
                            <div class="actions">
                                <button class="download-btn" data-url="${rawUrl}" data-filename="${file.name}"><span class="ico" style="--ico:url(../assets/icons/download.svg)"></span> 下载文件</button>
                                <a href="${rawUrl}" class="direct-link" target="_blank" title="直接打开（可右键另存为）"><span class="ico" style="--ico:url(../assets/icons/link.svg)"></span> 直连</a>
                            </div>
                        </div>
                    `;
                }
                fileListEl.innerHTML = html;
                document.querySelectorAll('.file-item .download-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const url = this.dataset.url;
                        const filename = this.dataset.filename;
                        const originalText = this.textContent;
                        this.disabled = true;
                        this.textContent = '下载中...';
                        downloadFile(url, filename);
                        setTimeout(() => {
                            this.disabled = false;
                            this.textContent = originalText;
                        }, 3000);
                    });
                });
            }

            refreshBtn.addEventListener('click', fetchFileList);
            proxySelect.addEventListener('change', fetchFileList);
            window.addEventListener('load', fetchFileList);
            console.log('Cloud 文件下载器已启动 (政策由 policy.js 管理)');
        })();
    </script>
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
