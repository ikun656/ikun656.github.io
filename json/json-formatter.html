<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式化器</title>
    <script>
        (function() {
            var m = document.cookie.match(/(^| )theme_pref=([^;]+)/);
            if (m && m[2] === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <link rel="stylesheet" href="/theme.css" />
    <style>
        /* ===== 基础样式 ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); padding: 40px 20px; color: var(--text); transition: background .2s, color .2s; }
        .container { max-width: 900px; margin: 0 auto; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 30px 35px; transition: background .2s; }
        h1 { font-size: 28px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; color: var(--text-strong); }
        .sub { color: var(--text-muted); font-size: 15px; margin-bottom: 25px; border-left: 4px solid var(--accent-bar); padding-left: 14px; }
        .ico { display: inline-block; width: 1.1em; height: 1.1em; flex-shrink: 0; background-color: currentColor; -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; vertical-align: -0.15em; }
        .btn .ico { margin-right: 6px; }

        /* ===== 文本域 ===== */
        .json-tool-area textarea { width: 100%; height: 200px; padding: 12px; border: 2px solid var(--border-strong); border-radius: 8px; font-family: 'SF Mono', 'Consolas', monospace; font-size: 14px; resize: vertical; transition: border 0.2s; background: var(--surface); color: var(--text); }
        .json-tool-area textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .json-indent-row { margin: 12px 0; display: flex; align-items: center; gap: 8px; }
        .json-indent-row label { font-size: 13px; color: var(--text-muted); }
        .json-indent-row select { padding: 4px 10px; border: 1px solid var(--border-strong); border-radius: 6px; font-size: 13px; background: var(--surface); color: var(--text); }

        /* ===== 按钮组 ===== */
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
        .btn { padding: 8px 20px; border: none; border-radius: 30px; font-weight: 500; cursor: pointer; transition: background 0.2s; background: var(--btn-bg); color: var(--text); font-size: 14px; }
        .btn:hover { background: var(--btn-bg-hover); }
        .btn.primary { background: var(--primary); color: #fff; }
        .btn.primary:hover { background: var(--primary-hover); }
        .btn.success { background: var(--success); color: #fff; }
        .btn.success:hover { background: var(--success-hover); }
        .btn.danger { background: var(--danger); color: #fff; }
        .btn.danger:hover { background: var(--danger-hover); }

        /* ===== 结果区 ===== */
        .result-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 8px; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-family: 'SF Mono', 'Consolas', monospace; font-size: 14px; color: var(--text-strong); }
        .result-box.error { color: var(--danger); background: rgba(220,53,69,0.08); border-color: var(--danger); }
        .status-msg { font-size: 14px; color: var(--text-muted); margin: 6px 0 4px; }
        .status-msg.error { color: var(--danger); }
        .status-msg.success { color: var(--success); }
        #resultWrapper { margin-top: 12px; }

        .footer { margin-top: 30px; font-size: 13px; color: var(--text-soft); text-align: center; border-top: 1px solid var(--border); padding-top: 20px; }
        .tip { background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 14px; color: var(--text-muted); }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }

        /* ===== 政策弹窗样式 ===== */
        .policy-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .policy-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .policy-card {
            background: var(--surface);
            max-width: 680px;
            width: 90%;
            max-height: 85vh;
            border-radius: 24px;
            padding: 32px 36px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.3);
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.3s;
        }
        .policy-overlay.show .policy-card {
            transform: scale(1);
        }
        .policy-card h2 {
            font-size: 24px;
            margin-bottom: 16px;
            color: var(--text-strong);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .policy-card .policy-text {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-muted);
            margin-bottom: 20px;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            background: var(--surface-2);
            max-height: 300px;
            overflow-y: auto;
        }
        .policy-card .policy-text strong {
            color: var(--primary);
        }
        .policy-card .btn-agree {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 14px 40px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .policy-card .btn-agree:hover {
            background: var(--primary-hover);
        }
        @media (max-width: 480px) {
            .container { padding: 22px 18px; }
            .policy-card { padding: 24px 20px; }
            .policy-card h2 { font-size: 20px; }
            .btn-group .btn { flex: 1; min-width: 80px; text-align: center; }
        }
    </style>
</head>
<body>


    <!-- ===== 页面主体 ===== -->
    <div class="container">
        <a href="../index.html" class="back-link">← 返回主页</a>
        <h1>JSON 格式化器</h1>
        <div class="sub">格式化、压缩、校验、转义，全程在浏览器里跑，不上传任何数据</div>
        <div class="tip"><strong>提示：</strong> 你粘贴的内容只在本地浏览器处理，关掉页面即消失。</div>

        <div class="json-tool-area">
            <textarea id="jsonInput" placeholder="在此粘贴 JSON 数据…">{"name":"ikun656","tools":["vsix","json"],"version":"1.0"}</textarea>
            <div class="json-indent-row">
                <label for="jsonIndent">缩进：</label>
                <select id="jsonIndent">
                    <option value="2">2 空格</option>
                    <option value="4" selected>4 空格</option>
                </select>
            </div>
            <div class="btn-group">
                <button class="btn primary" id="btnFormat"><span class="ico" style="--ico:url(../assets/icons/sparkles.svg)"></span> 格式化</button>
                <button class="btn" id="btnCompress"><span class="ico" style="--ico:url(../assets/icons/minimize.svg)"></span> 压缩</button>
                <button class="btn success" id="btnValidate"><span class="ico" style="--ico:url(../assets/icons/check.svg)"></span> 校验</button>
                <button class="btn" id="btnEscape"><span class="ico" style="--ico:url(../assets/icons/refresh-cw.svg)"></span> 转义</button>
                <button class="btn" id="btnUnescape"><span class="ico" style="--ico:url(../assets/icons/refresh-cw.svg)"></span> 反转义</button>
                <button class="btn danger" id="btnClear"><span class="ico" style="--ico:url(../assets/icons/trash-2.svg)"></span> 清空</button>
            </div>
            <div id="jsonStatus" class="status-msg">等待操作…</div>
            <div style="display:none;" id="resultWrapper">
                <div id="jsonResult" class="result-box"></div>
                <button class="btn" id="btnCopy" style="margin-top:8px;"><span class="ico" style="--ico:url(../assets/icons/copy.svg)"></span> 复制</button>
            </div>
        </div>

        <div class="footer">全程在浏览器里跑，不上传任何数据 · 访客 <span id="busuanzi_value_site_uv">-</span> · 浏览 <span id="busuanzi_value_site_pv">-</span></div>
    </div>

    <!-- ===== 引入独立的 policy.js / theme.js ===== -->
    <script src="/policy.js"></script>
    <script src="/theme.js"></script>

    <!-- ===== JSON 工具逻辑 ===== -->
    <script>
        (function() {
            'use strict';

            const inputEl = document.getElementById('jsonInput');
            const resultEl = document.getElementById('jsonResult');
            const statusEl = document.getElementById('jsonStatus');
            const btnFormat = document.getElementById('btnFormat');
            const btnCompress = document.getElementById('btnCompress');
            const btnValidate = document.getElementById('btnValidate');
            const btnEscape = document.getElementById('btnEscape');
            const btnUnescape = document.getElementById('btnUnescape');
            const btnClear = document.getElementById('btnClear');
            const indentSelect = document.getElementById('jsonIndent');
            const resultWrapper = document.getElementById('resultWrapper');
            const btnCopy = document.getElementById('btnCopy');

            function setStatus(msg, type) {
                statusEl.textContent = msg;
                statusEl.className = 'status-msg' + (type ? ' ' + type : '');
            }
            function showResult(text, isError) {
                resultEl.textContent = text || '';
                resultEl.className = 'result-box' + (isError ? ' error' : '');
                resultWrapper.style.display = 'block';
            }
            function hideResult() { resultWrapper.style.display = 'none'; resultEl.className = 'result-box'; }
            function getJsonData() {
                const raw = inputEl.value.trim();
                if (!raw) { setStatus('请输入 JSON 数据', 'error'); return null; }
                try { return JSON.parse(raw); }
                catch (e) { setStatus('JSON 解析错误: ' + e.message, 'error'); showResult(e.message, true); return null; }
            }

            btnFormat.addEventListener('click', function() {
                const data = getJsonData();
                if (data === null) return;
                const indent = parseInt(indentSelect.value, 10);
                try { const formatted = JSON.stringify(data, null, indent); showResult(formatted, false); setStatus('格式化成功', 'success'); }
                catch (e) { setStatus('格式化失败: ' + e.message, 'error'); showResult(e.message, true); }
            });
            btnCompress.addEventListener('click', function() {
                const data = getJsonData();
                if (data === null) return;
                try { const compressed = JSON.stringify(data); showResult(compressed, false); setStatus('压缩成功', 'success'); }
                catch (e) { setStatus('压缩失败: ' + e.message, 'error'); showResult(e.message, true); }
            });
            btnValidate.addEventListener('click', function() {
                const raw = inputEl.value.trim();
                if (!raw) { setStatus('请输入 JSON 数据', 'error'); hideResult(); return; }
                try { JSON.parse(raw); setStatus('校验通过', 'success'); showResult('JSON 语法正确', false); }
                catch (e) { setStatus('校验失败: ' + e.message, 'error'); showResult(e.message, true); }
            });
            btnEscape.addEventListener('click', function() {
                const raw = inputEl.value.trim();
                if (!raw) { setStatus('请输入 JSON 数据', 'error'); hideResult(); return; }
                const escaped = JSON.stringify(raw);
                showResult(escaped, false); setStatus('转义成功', 'success');
            });
            btnUnescape.addEventListener('click', function() {
                const raw = inputEl.value.trim();
                if (!raw) { setStatus('请输入字符串', 'error'); hideResult(); return; }
                try { const unescaped = JSON.parse(raw); showResult(unescaped, false); setStatus('反转义成功', 'success'); }
                catch (e) { setStatus('反转义失败: ' + e.message, 'error'); showResult(e.message, true); }
            });
            btnClear.addEventListener('click', function() { inputEl.value = ''; hideResult(); setStatus('已清空', ''); });
            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.top = '-9999px';
                document.body.appendChild(ta);
                ta.focus(); ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                document.body.removeChild(ta);
                return ok;
            }
            btnCopy.addEventListener('click', function() {
                const text = resultEl.textContent;
                if (!text) { setStatus('没有可复制的内容', 'error'); return; }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() { setStatus('已复制到剪贴板', 'success'); }).catch(function() { setStatus(fallbackCopy(text) ? '已复制到剪贴板' : '复制失败', fallbackCopy(text) ? 'success' : 'error'); });
                } else {
                    setStatus(fallbackCopy(text) ? '已复制到剪贴板' : '复制失败', fallbackCopy(text) ? 'success' : 'error');
                }
            });

            window.addEventListener('load', function() { setStatus('输入 JSON 数据，点击按钮操作', ''); hideResult(); });
            console.log('JSON 格式化器已启动 (政策由 policy.js 管理)');
        })();
    </script>
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
